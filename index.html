<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
       :root{
            --primary-color: #fff;
            --secondary-color: #000;
            --GRAY0-COLOR: #f8f9fa;
            --ORANGE2-COLOR: #ffd8a8;
            --GRAY1-COLOR: #f1f3f5;
            --YELLOW5-COLOR: #fcc419;
            --GREY5-COLOR: #adb5bd;
        }
        body{
            font-family: "Work Sans", sans-serif;
        }
        .login{
            width: 100%;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),url('./poster.jpg') no-repeat center center/cover;
        }
        .login-container{
            width: 400px;
            height: 300px;
            background: #ffffff09;
            backdrop-filter: blur(5px);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .active{
            display: block;
        }
        .login-tabs{
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 50px;
            background: #ffffff09;
            border-bottom: 1px solid #ffffff09;
        }
        .login-tab{
            width: 50%;
            height: 100%;
            background: none;
            border: none;
            outline: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .login-tab.active{
            border-bottom: 2px solid var(--YELLOW5-COLOR);
        }
        .login-forms{
            padding: 20px;
        }
        .login-form{
            display: none;
            flex-direction: column;
        }
        .login-form.active{
            display: flex;
        }
        .login-form input{
            font-family: "Work Sans", sans-serif;
            width: 100%;
            height: 40px;
            margin-bottom: 20px;
            padding: 0 10px;
            border: .5px solid #fff;
            outline: none;
            border-radius: 5px;
            backdrop-filter: blur(5px);
            background: #0000003d;
            color: #fff;
        }
        .login-form input:focus{
            box-shadow: inset 0px 0px 0px 2px var(--YELLOW5-COLOR);
            border: none;
        }
        .login-form button{
            width: 100%;
            height: 40px;
            border: none;
            outline: none;
            border-radius: 5px;
            background: #fff;
            color: #000;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .login-form button:hover{
            background: var(--YELLOW5-COLOR);
            color: #fff;
        }
      
    </style>
</head>
<body>
    <section class="login">
        <div class="login-container">
            <div class="login-tabs">
                <button class="login-tab active" data-tab="login">Login</button>
                <button class="login-tab" data-tab="signup">Sign Up</button>
            </div>
            <div class="login-forms">
                <form action="" class="login-form active">
                    <input type="text" placeholder="Username" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <form action="" class="login-form ">
                    <input type="text" placeholder="Email" required>
                    <input type="text" placeholder="Username" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Sign Up</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
